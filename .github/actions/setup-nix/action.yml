name: Setup Nix
description: Install Nix with nixpkgs-unstable channel

inputs:
  github-token:
    description: GitHub token for private flake inputs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          access-tokens = github.com=${{ inputs.github-token }}
    - uses: DeterminateSystems/magic-nix-cache-action@v8
